# Each mode is a separate Compose project with its own containers and volumes.
# START-*.cmd set APP_MODE; for manual commands run `set APP_MODE=demo` first.
name: mailcontrol-${APP_MODE:-local}

services:
  db:
    build: ./docker/db
    image: mailcontrol-db
    init: true
    environment:
      POSTGRES_DB: mailcontrol
      # Bootstrap superuser stays administrative; the app connects as "mailcontrol".
      POSTGRES_USER: mailcontrol_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use START-DEMO.cmd or create the local .env file first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      # Healthy only after the entrypoint re-synchronised the app role password.
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/mailcontrol-role-synced && pg_isready -h 127.0.0.1 -U mailcontrol -d mailcontrol",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks: [database]

  app:
    build: .
    image: mailcontrol-app
    environment: &app-environment
      APP_MODE: ${APP_MODE:-local}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: mailcontrol
      PGUSER: mailcontrol
      PGPASSWORD: ${POSTGRES_PASSWORD:?Use START-DEMO.cmd or create the local .env file first}
      MAILCONTROL_DATA_DIR: /var/lib/mailcontrol
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - secrets:/var/lib/mailcontrol
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    restart: unless-stopped
    networks: [database]

  worker:
    image: mailcontrol-app
    command: ["node", "dist/server/worker.js"]
    environment: *app-environment
    volumes:
      - secrets:/var/lib/mailcontrol
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped
    networks: [database]

volumes:
  database:
    name: mailcontrol-${APP_MODE:-local}-data
  secrets:
    name: mailcontrol-${APP_MODE:-local}-secrets

networks:
  database:
    internal: true
